<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokémon Roulette Deluxe</title>
  <style>
    :root {
      --bg1: #07111f;
      --bg2: #0f172a;
      --panel: rgba(15, 23, 42, 0.8);
      --panel-2: rgba(30, 41, 59, 0.82);
      --gold: #fbbf24;
      --gold-2: #f59e0b;
      --cyan: #67e8f9;
      --pink: #f472b6;
      --green: #4ade80;
      --red: #ef4444;
      --text: #edf6ff;
      --muted: #bfd3ec;
      --shadow: rgba(0,0,0,0.42);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background:
        radial-gradient(circle at top, rgba(251,191,36,0.12), transparent 24%),
        linear-gradient(135deg, #020817 0%, #0b1120 25%, #111827 55%, #1e293b 100%);
      color: var(--text);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .game-shell {
      width: min(1240px, 100%);
      background: rgba(8, 15, 30, 0.76);
      border: 1px solid rgba(103, 232, 249, 0.25);
      border-radius: 28px;
      box-shadow:
        0 30px 60px rgba(0,0,0,0.5),
        inset 0 0 30px rgba(103, 232, 249, 0.06);
      overflow: hidden;
      backdrop-filter: blur(14px);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      padding: 20px 26px;
      background: linear-gradient(90deg, rgba(17,24,39,0.95), rgba(15,23,42,0.88));
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 900;
      color: var(--gold);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: clamp(1.12rem, 2vw, 2rem);
      text-shadow: 0 0 18px rgba(251,191,36,0.28);
    }

    .brand-ball {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff, #fef2f2 18%, #ef4444 20%, #991b1b 100%);
      position: relative;
      box-shadow: inset -8px -8px 0 rgba(0,0,0,0.08), 0 4px 14px rgba(239,68,68,0.42);
    }

    .brand-ball::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: linear-gradient(90deg, transparent 48%, rgba(15,23,42,0.88) 48%, rgba(15,23,42,0.88) 52%, transparent 52%);
    }

    .trainer-status {
      background: rgba(251,191,36,0.08);
      border: 1px solid rgba(251,191,36,0.4);
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: 800;
      color: #fef3c7;
      box-shadow: inset 0 0 20px rgba(251,191,36,0.08);
    }

    .content {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 24px;
      padding: 24px;
    }

    .panel, .encounter {
      background: linear-gradient(180deg, rgba(30,41,59,0.9), rgba(15,23,42,0.84));
      border-radius: 24px;
      border: 1px solid rgba(148,163,184,0.18);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .panel {
      padding: 20px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--muted);
    }

    select, button {
      width: 100%;
      border: none;
      border-radius: 14px;
      font: inherit;
      outline: none;
    }

    select {
      background: rgba(224,242,254,0.96);
      color: #0f172a;
      padding: 14px 16px;
      font-weight: 800;
      box-shadow: inset 0 0 0 1px rgba(59,130,246,0.15);
    }

    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      cursor: pointer;
      padding: 14px 16px;
      font-weight: 900;
      letter-spacing: 0.04em;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.22);
    }

    .primary {
      background: linear-gradient(180deg, #fbbf24 0%, #f59e0b 100%);
      color: #0f172a;
    }

    .secondary {
      background: linear-gradient(180deg, #67e8f9 0%, #2563eb 100%);
      color: white;
    }

    .danger {
      background: linear-gradient(180deg, #fb7185 0%, #e11d48 100%);
      color: white;
      margin-top: 12px;
    }

    .message {
      margin-top: 18px;
      min-height: 84px;
      background: rgba(34,197,94,0.08);
      border-left: 4px solid var(--green);
      border-radius: 14px;
      padding: 14px 16px;
      color: #d1fae5;
      line-height: 1.5;
      font-weight: 700;
      box-shadow: inset 0 0 0 1px rgba(74,222,128,0.1);
    }

    .encounter {
      position: relative;
      overflow: hidden;
      padding: 22px;
    }

    .encounter::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at top, rgba(103,232,249,0.12), transparent 42%),
        linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
      pointer-events: none;
    }

    .poke-stage {
      position: relative;
      width: 300px;
      height: 300px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.12), rgba(255,255,255,0) 60%);
      border: 1px solid rgba(255,255,255,0.07);
      transition: all 0.3s ease;
      overflow: hidden;
    }

    .poke-stage::after {
      content: "";
      position: absolute;
      inset: 24px;
      border: 2px dashed rgba(255,255,255,0.08);
      border-radius: 50%;
    }

    .poke-stage.shiny {
      box-shadow: 0 0 40px rgba(251,191,36,0.7), 0 0 70px rgba(244,114,182,0.35);
      animation: pulseBorder 1.3s infinite alternate;
    }

    .poke-stage img {
      width: 230px;
      height: 230px;
      object-fit: contain;
      filter: drop-shadow(0 18px 20px rgba(0,0,0,0.4));
      transition: transform 0.25s ease;
      user-select: none;
    }

    .poke-stage.shiny img {
      animation: bob 1.8s ease-in-out infinite alternate;
    }

    @keyframes bob {
      from { transform: translateY(0) scale(1); }
      to { transform: translateY(-6px) scale(1.05); }
    }

    @keyframes pulseBorder {
      from { box-shadow: 0 0 18px rgba(251,191,36,0.55), 0 0 28px rgba(251,191,36,0.2); }
      to { box-shadow: 0 0 32px rgba(244,114,182,0.75), 0 0 55px rgba(103,232,249,0.36); }
    }

    .pokemon-name {
      text-align: center;
      font-size: clamp(1.8rem, 2.4vw, 3rem);
      font-weight: 900;
      letter-spacing: 0.03em;
      margin: 2px 0 12px;
      text-shadow: 0 4px 18px rgba(0,0,0,0.36);
    }

    .meta {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    .tag {
      background: rgba(15,118,110,0.24);
      border: 1px solid rgba(103,232,249,0.3);
      color: #d9fbff;
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(150px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .stat {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 14px 16px;
    }

    .stat strong {
      display: block;
      margin-bottom: 8px;
      text-transform: uppercase;
      font-size: 0.72rem;
      color: #b7cdfd;
      letter-spacing: 0.06em;
    }

    .stat span {
      font-weight: 800;
      font-size: 1.08rem;
    }

    .collection {
      margin-top: 22px;
    }

    .collection-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
    }

    .collection h3 {
      margin: 0;
      font-size: 1.28rem;
    }

    .badge {
      background: rgba(103,232,249,0.12);
      border: 1px solid rgba(103,232,249,0.2);
      border-radius: 999px;
      color: #d7f9ff;
      padding: 6px 10px;
      font-size: 0.8rem;
      font-weight: 800;
    }

    .collection-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 12px;
    }

    .mini {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 10px 8px 8px;
      text-align: center;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: transform 0.18s ease, border-color 0.18s ease;
    }

    .mini:hover {
      transform: translateY(-2px);
      border-color: rgba(251,191,36,0.45);
    }

    .mini img {
      width: 66px;
      height: 66px;
      object-fit: contain;
      filter: drop-shadow(0 10px 12px rgba(0,0,0,0.28));
      margin-bottom: 6px;
    }

    .mini small {
      color: #dfeafc;
      font-weight: 700;
      line-height: 1.2;
    }

    .empty {
      background: rgba(255,255,255,0.02);
      border: 1px dashed rgba(255,255,255,0.1);
      color: #dfeafc;
      padding: 18px 14px;
      border-radius: 12px;
      text-align: center;
      font-weight: 700;
    }

    @media (max-width: 900px) {
      .content {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 540px) {
      .action-row {
        grid-template-columns: 1fr;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="topbar">
      <div class="brand">
        <span class="brand-ball"></span>
        <span>Pokémon Roulette</span>
      </div>
      <div class="trainer-status" id="trainerStatus">Treinador: Rookie</div>
    </div>

    <div class="content">
      <aside class="panel">
        <div class="field">
          <label for="regionSelect">Região</label>
          <select id="regionSelect"></select>
        </div>

        <div class="field">
          <label for="pokemonSelect">Pokémon desejado</label>
          <select id="pokemonSelect">
            <option value="">Aleatório</option>
          </select>
        </div>

        <div class="field">
          <label for="captureMode">Modo de captura</label>
          <select id="captureMode">
            <option value="normal">Pokébola</option>
            <option value="great">Super Bola</option>
            <option value="ultra">Ultra Bola</option>
            <option value="master">Master Bola</option>
          </select>
        </div>

        <div class="action-row">
          <button class="primary" id="spinBtn">Girar</button>
          <button class="secondary" id="captureBtn">Capturar</button>
        </div>

        <button class="danger" id="resetBtn">Resetar coleção</button>

        <div class="message" id="messageBox">
          Escolha uma região e rode a roleta para encontrar um Pokémon selvagem!
        </div>
      </aside>

      <main class="encounter">
        <div class="poke-stage" id="pokeStage">
          <img id="pokemonImage" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png" alt="Pokémon">
        </div>

        <div class="pokemon-name" id="pokemonName">Pikachu</div>

        <div class="meta">
          <span class="tag" id="tagRegion">Kanto</span>
          <span class="tag" id="tagType">Elétrico</span>
          <span class="tag" id="tagRarity">Comum</span>
        </div>

        <div class="stats">
          <div class="stat">
            <strong>Captura</strong>
            <span id="captureChance">0%</span>
          </div>
          <div class="stat">
            <strong>Shiny</strong>
            <span id="shinyStatus">Não</span>
          </div>
          <div class="stat">
            <strong>Modo</strong>
            <span id="modeStatus">Pokébola</span>
          </div>
          <div class="stat">
            <strong>Evolução</strong>
            <span id="evolutionStatus">---</span>
          </div>
        </div>

        <div class="collection">
          <div class="collection-head">
            <h3>Pokédex</h3>
            <span class="badge" id="countBadge">0 capturados</span>
          </div>
          <div class="collection-grid" id="collectionGrid"></div>
        </div>
      </main>
    </div>
  </div>

  <script>
    const pokeData = {
      kanto: [
        { id: 1, name: "Bulbassauro", type: "Planta", rarity: "Comum", chance: 14, captureRate: 58, evolution: "Ivysaur", evolutionChance: 0.32, region: "Kanto" },
        { id: 4, name: "Charmander", type: "Fogo", rarity: "Comum", chance: 13, captureRate: 56, evolution: "Charmeleon", evolutionChance: 0.3, region: "Kanto" },
        { id: 7, name: "Squirtle", type: "Água", rarity: "Comum", chance: 13, captureRate: 57, evolution: "Wartortle", evolutionChance: 0.3, region: "Kanto" },
        { id: 25, name: "Pikachu", type: "Elétrico", rarity: "Comum", chance: 12, captureRate: 60, evolution: "Raichu", evolutionChance: 0.34, region: "Kanto" },
        { id: 133, name: "Eevee", type: "Normal", rarity: "Raro", chance: 9, captureRate: 48, evolution: "Vaporeon", evolutionChance: 0.28, region: "Kanto" },
        { id: 143, name: "Snorlax", type: "Normal", rarity: "Raro", chance: 8, captureRate: 46, evolution: null, evolutionChance: 0, region: "Kanto" },
        { id: 150, name: "Mewtwo", type: "Psíquico", rarity: "Lendário", chance: 2, captureRate: 22, evolution: null, evolutionChance: 0, region: "Kanto" },
        { id: 151, name: "Mew", type: "Psíquico", rarity: "Lendário", chance: 2, captureRate: 20, evolution: null, evolutionChance: 0, region: "Kanto" }
      ],
      johto: [
        { id: 152, name: "Chikorita", type: "Planta", rarity: "Comum", chance: 14, captureRate: 59, evolution: "Bayleef", evolutionChance: 0.32, region: "Johto" },
        { id: 155, name: "Cyndaquil", type: "Fogo", rarity: "Comum", chance: 13, captureRate: 58, evolution: "Quilava", evolutionChance: 0.31, region: "Johto" },
        { id: 158, name: "Totodile", type: "Água", rarity: "Comum", chance: 13, captureRate: 59, evolution: "Croconaw", evolutionChance: 0.31, region: "Johto" },
        { id: 175, name: "Togepi", type: "Fada", rarity: "Raro", chance: 10, captureRate: 49, evolution: "Togetic", evolutionChance: 0.28, region: "Johto" },
        { id: 246, name: "Larvitar", type: "Pedra", rarity: "Raro", chance: 9, captureRate: 46, evolution: "Pupitar", evolutionChance: 0.26, region: "Johto" },
        { id: 244, name: "Entei", type: "Fogo", rarity: "Lendário", chance: 3, captureRate: 18, evolution: null, evolutionChance: 0, region: "Johto" },
        { id: 249, name: "Lugia", type: "Psíquico", rarity: "Lendário", chance: 2, captureRate: 16, evolution: null, evolutionChance: 0, region: "Johto" }
      ],
      hoenn: [
        { id: 252, name: "Treecko", type: "Planta", rarity: "Comum", chance: 14, captureRate: 59, evolution: "Grovyle", evolutionChance: 0.31, region: "Hoenn" },
        { id: 255, name: "Torchic", type: "Fogo", rarity: "Comum", chance: 13, captureRate: 58, evolution: "Combusken", evolutionChance: 0.29, region: "Hoenn" },
        { id: 258, name: "Mudkip", type: "Água", rarity: "Comum", chance: 13, captureRate: 60, evolution: "Marshtomp", evolutionChance: 0.31, region: "Hoenn" },
        { id: 300, name: "Skitty", type: "Normal", rarity: "Raro", chance: 10, captureRate: 50, evolution: "Delcatty", evolutionChance: 0.27, region: "Hoenn" },
        { id: 302, name: "Sableye", type: "Trevas", rarity: "Raro", chance: 8, captureRate: 47, evolution: null, evolutionChance: 0, region: "Hoenn" },
        { id: 382, name: "Kyogre", type: "Água", rarity: "Lendário", chance: 2, captureRate: 18, evolution: null, evolutionChance: 0, region: "Hoenn" },
        { id: 384, name: "Rayquaza", type: "Dragão", rarity: "Lendário", chance: 2, captureRate: 16, evolution: null, evolutionChance: 0, region: "Hoenn" }
      ],
      sinnoh: [
        { id: 387, name: "Turtwig", type: "Planta", rarity: "Comum", chance: 14, captureRate: 60, evolution: "Grotle", evolutionChance: 0.31, region: "Sinnoh" },
        { id: 390, name: "Chimchar", type: "Fogo", rarity: "Comum", chance: 13, captureRate: 58, evolution: "Monferno", evolutionChance: 0.29, region: "Sinnoh" },
        { id: 393, name: "Piplup", type: "Água", rarity: "Comum", chance: 13, captureRate: 59, evolution: "Prinplup", evolutionChance: 0.3, region: "Sinnoh" },
        { id: 403, name: "Shinx", type: "Elétrico", rarity: "Raro", chance: 10, captureRate: 51, evolution: "Luxio", evolutionChance: 0.27, region: "Sinnoh" },
        { id: 448, name: "Lucario", type: "Lutador", rarity: "Raro", chance: 7, captureRate: 40, evolution: null, evolutionChance: 0, region: "Sinnoh" },
        { id: 487, name: "Giratina", type: "Fantasma", rarity: "Lendário", chance: 2, captureRate: 17, evolution: null, evolutionChance: 0, region: "Sinnoh" }
      ]
    };

    const captureModes = {
      normal: { label: "Pokébola", bonus: 0 },
      great: { label: "Super Bola", bonus: 12 },
      ultra: { label: "Ultra Bola", bonus: 22 },
      master: { label: "Master Bola", bonus: 38 }
    };

    const state = {
      region: "kanto",
      selectedName: "",
      encounter: null,
      trainer: "Rookie",
      collection: JSON.parse(localStorage.getItem("pokemonCollection") || "[]")
    };

    const regionSelect = document.getElementById("regionSelect");
    const pokemonSelect = document.getElementById("pokemonSelect");
    const captureMode = document.getElementById("captureMode");
    const spinBtn = document.getElementById("spinBtn");
    const captureBtn = document.getElementById("captureBtn");
    const resetBtn = document.getElementById("resetBtn");
    const messageBox = document.getElementById("messageBox");
    const trainerStatus = document.getElementById("trainerStatus");
    const pokemonImage = document.getElementById("pokemonImage");
    const pokemonName = document.getElementById("pokemonName");
    const tagRegion = document.getElementById("tagRegion");
    const tagType = document.getElementById("tagType");
    const tagRarity = document.getElementById("tagRarity");
    const captureChance = document.getElementById("captureChance");
    const shinyStatus = document.getElementById("shinyStatus");
    const modeStatus = document.getElementById("modeStatus");
    const evolutionStatus = document.getElementById("evolutionStatus");
    const pokeStage = document.getElementById("pokeStage");
    const collectionGrid = document.getElementById("collectionGrid");
    const countBadge = document.getElementById("countBadge");

    function titleCase(value) {
      return value.charAt(0).toUpperCase() + value.slice(1);
    }

    function getRegionList(regionKey) {
      return pokeData[regionKey] || pokeData.kanto;
    }

    function randomFrom(list) {
      const total = list.reduce((sum, item) => sum + item.chance, 0);
      let roll = Math.random() * total;

      for (const item of list) {
        roll -= item.chance;
        if (roll <= 0) return item;
      }
      return list[0];
    }

    function populateRegions() {
      regionSelect.innerHTML = "";
      Object.keys(pokeData).forEach(regionKey => {
        const opt = document.createElement("option");
        opt.value = regionKey;
        opt.textContent = titleCase(regionKey);
        regionSelect.appendChild(opt);
      });
      regionSelect.value = state.region;
      populatePokemonSelect();
    }

    function populatePokemonSelect() {
      const list = getRegionList(state.region);
      pokemonSelect.innerHTML = '<option value="">Aleatório</option>';
      list.forEach(pokemon => {
        const opt = document.createElement("option");
        opt.value = pokemon.name;
        opt.textContent = pokemon.name;
        pokemonSelect.appendChild(opt);
      });
    }

    function getModeInfo() {
      return captureModes[captureMode.value] || captureModes.normal;
    }

    function calculateCaptureChance(pokemon, modeKey) {
      const mode = captureModes[modeKey] || captureModes.normal;
      let chance = pokemon.captureRate + mode.bonus;

      if (pokemon.rarity === "Raro") chance -= 8;
      if (pokemon.rarity === "Lendário") chance -= 18;

      return Math.min(97, Math.max(10, chance));
    }

    function renderEncounter(encounter) {
      const imageUrl = encounter.isShiny ? encounter.shinySprite : encounter.sprite;
      pokemonImage.src = imageUrl;
      pokemonName.textContent = encounter.isShiny ? `${encounter.name} ✨` : encounter.name;

      tagRegion.textContent = encounter.region;
      tagType.textContent = encounter.type;
      tagRarity.textContent = encounter.rarity;
      captureChance.textContent = `${Math.round(encounter.captureChance)}%`;
      shinyStatus.textContent = encounter.isShiny ? "Sim" : "Não";
      modeStatus.textContent = encounter.mode;
      evolutionStatus.textContent = encounter.evolution || "---";

      pokeStage.classList.toggle("shiny", encounter.isShiny);
    }

    function renderCollection() {
      collectionGrid.innerHTML = "";
      if (!state.collection.length) {
        collectionGrid.innerHTML = '<div class="empty">Nenhum Pokémon capturado ainda.</div>';
        countBadge.textContent = "0 capturados";
        return;
      }

      state.collection.forEach(item => {
        const card = document.createElement("div");
        card.className = "mini";

        const img = document.createElement("img");
        img.src = item.isShiny
          ? `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/${item.id}.png`
          : `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${item.id}.png`;

        const label = document.createElement("small");
        label.textContent = item.name;

        card.appendChild(img);
        card.appendChild(label);
        collectionGrid.appendChild(card);
      });

      countBadge.textContent = `${state.collection.length} capturados`;
    }

    function persistCollection() {
      localStorage.setItem("pokemonCollection", JSON.stringify(state.collection));
    }

    function updateTrainerStatus() {
      trainerStatus.textContent = `Treinador: ${state.trainer}`;
    }

    function playTone(freq, duration, type = "sine", volume = 0.04) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;

      const ctx = new AudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.value = volume;

      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start();
      osc.stop(ctx.currentTime + duration);
    }

    function playSuccessSound() {
      playTone(660, 0.08, "square", 0.06);
      setTimeout(() => playTone(880, 0.08, "triangle", 0.055), 90);
      setTimeout(() => playTone(1100, 0.1, "triangle", 0.05), 180);
    }

    function playFailSound() {
      playTone(200, 0.16, "sawtooth", 0.05);
    }

    function spinEncounter() {
      const list = getRegionList(state.region);
      const selectedName = pokemonSelect.value;
      const chosen = selectedName
        ? list.find(p => p.name.toLowerCase() === selectedName.toLowerCase()) || randomFrom(list)
        : randomFrom(list);

      const shiny = Math.random() < 0.012;
      const mode = getModeInfo();

      const encounter = {
        ...chosen,
        isShiny: shiny,
        mode: mode.label,
        captureChance: calculateCaptureChance(chosen, captureMode.value),
        sprite: `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${chosen.id}.png`,
        shinySprite: `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/${chosen.id}.png`
      };

      state.encounter = encounter;
      renderEncounter(encounter);
      messageBox.textContent = `Um ${encounter.name} selvagem apareceu na região ${encounter.region}!`;

      playTone(370, 0.08, "triangle", 0.04);
      setTimeout(() => playTone(520, 0.1, "square", 0.032), 120);
    }

    function captureEncounter() {
      if (!state.encounter) {
        messageBox.textContent = "Primeiro gire a roleta para encontrar um Pokémon selvagem!";
        return;
      }

      const encounter = state.encounter;
      const success = Math.random() * 100 < encounter.captureChance;

      if (!success) {
        messageBox.textContent = `${encounter.name} escapou! Tente novamente.`;
        playFailSound();
        return;
      }

      const alreadyCaptured = state.collection.some(item => item.id === encounter.id && item.isShiny === encounter.isShiny);

      if (!alreadyCaptured) {
        state.collection.push({
          id: encounter.id,
          name: encounter.name,
          isShiny: encounter.isShiny
        });
        persistCollection();
      }

      state.trainer = "Treinador Pokémon";
      updateTrainerStatus();
      renderCollection();

      let result = `${encounter.name} foi capturado com sucesso!`;

      if (encounter.evolution) {
        const evolutionChance = (encounter.evolutionChance || 0.28) * 100;
        if (Math.random() * 100 <= evolutionChance) {
          result = `${encounter.name} evoluiu para ${encounter.evolution}!`;
        } else {
          result = `${encounter.name} foi capturado, mas não evoluiu.`;
        }
      }

      if (encounter.isShiny) {
        result += " Você encontrou um Pokémon Shiny!";
      }

      messageBox.textContent = result;
      playSuccessSound();
    }

    function resetCollection() {
      state.collection = [];
      persistCollection();
      renderCollection();
      state.trainer = "Rookie";
      updateTrainerStatus();
      messageBox.textContent = "Coleção reiniciada. Você pode procurar novos Pokémon.";
    }

    regionSelect.addEventListener("change", () => {
      state.region = regionSelect.value;
      populatePokemonSelect();
      messageBox.textContent = `Região selecionada: ${titleCase(state.region)}. Gire a roleta para encontrar um Pokémon!`;
    });

    spinBtn.addEventListener("click", spinEncounter);
    captureBtn.addEventListener("click", captureEncounter);
    resetBtn.addEventListener("click", resetCollection);

    populateRegions();
    renderCollection();
    updateTrainerStatus();
    spinEncounter();
  </script>
</body>
</html>
